; SISEMB · ESP32-CAM → simpleBroker (robot/camera)
; Placa: AI-Thinker ESP32-CAM (OV2640)

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
build_flags =
    -DCORE_DEBUG_LEVEL=1
